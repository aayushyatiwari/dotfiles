## WirePlumber Bluetooth config for JBL Tune 770NC
## Handles:
##   - A2DP (high-quality stereo audio, no mic) for music
##   - Stays on A2DP always; calls use the laptop's built-in mic
##   - HFP/mSBC still available, but only if picked by hand (pavucontrol/pactl)

wireplumber.settings = {
  ## Don't auto-switch to headset profile (HFP) when a mic stream opens.
  ## HFP drops playback to mono call quality and often got stuck there after
  ## calls ended. Calls use the laptop mic instead, so playback stays on A2DP.
  bluetooth.autoswitch-to-headset-profile = false

  ## Remember and restore the last used profile
  bluetooth.use-persistent-storage = true

  ## Prefer quality (A2DP) over latency when selecting profile automatically
  bluetooth.profile-preference = quality
}

monitor.bluez.properties = {
  ## Enable all Bluetooth roles
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hfp_hf hfp_ag hsp_hs hsp_ag ]

  ## Preferred A2DP codecs in order: AAC (best for JBL 770NC), then aptX, SBC-XQ, SBC
  ## The 770NC supports AAC natively — much better than SBC
  bluez5.codecs = [ aac aptx aptx_hd sbc_xq sbc ]

  ## HFP backend — native lets PipeWire handle HFP directly (no ofono needed)
  bluez5.hfphsp-backend = native

  ## Enable mSBC (wideband, better mic quality) + CVSD fallback
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true

  ## Enable headset loopback (needed for mic to appear as a proper source)
  bluez5.headset-roles = [ hfp_hf hsp_hs hfp_ag hsp_ag ]

  ## Auto-connect trusted devices
  bluez5.auto-connect = [ a2dp_sink hfp_hf hsp_hs ]
}
