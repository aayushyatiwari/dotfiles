# Hyprland.
#
# Look and feel: ported from Omarchy (github.com/omacom/omarchy, branch
#   quattro, default/hypr/looknfeel.lua + envs.lua + nvidia.lua). Omarchy
#   configures Hyprland in Lua now; the values below are the same numbers
#   translated into the legacy config format.
# Keybindings: ported from ~/.config/i3/config, unchanged. The i3 line each
#   binding came from is quoted above it.
#
#   i3 $mod (Mod1) -> ALT        i3 Mod4 -> SUPER


# --- BASIC SETTINGS -----------------------------------------------------------
$mod = ALT

# i3: exec_always setxkbmap -option "caps:ctrl_modifier"
input {
    kb_layout = us
    kb_options = caps:ctrl_modifier
    follow_mouse = 1          # i3 focus_follows_mouse yes (its default)
    sensitivity = 0
    touchpad {
        natural_scroll = false
        clickfinger_behavior = true
        disable_while_typing = true
    }
}

# Omarchy: general
$accent_active   = rgba(33ccffee) rgba(00ff99ee) 45deg
$accent_inactive = rgba(595959aa)

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $accent_active
    col.inactive_border = $accent_inactive
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

# Omarchy: decoration. Note that Omarchy runs with square corners, no shadows
# and no blur — the polish comes from the gaps, the gradient border and the
# animations, not from effects.
decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

# Omarchy: group + groupbar. This is what $mod+w / $mod+s (tabbed) look like.
group {
    col.border_active = $accent_active
    col.border_inactive = $accent_inactive

    # New windows opened while a group is focused join that group, which is
    # what makes it behave like an i3 tabbed container.
    auto_group = true
    drag_into_group = 1
    merge_groups_on_drag = true

    groupbar {
        font_size = 12
        font_family = JetBrainsMono Nerd Font, Iosevka Nerd Font, monospace
        font_weight_active = ultraheavy
        font_weight_inactive = normal
        indicator_height = 1
        indicator_gap = 5
        height = 22
        gaps_in = 5
        gaps_out = 0
        text_color = rgb(ffffff)
        text_color_inactive = rgba(ffffff90)
        col.active = rgba(00000040)
        col.inactive = rgba(00000020)
        gradients = true
        gradient_rounding = 0
        gradient_round_only_edges = false
    }
}

# Omarchy: animation curves and per-leaf speeds, verbatim.
animations {
    enabled = true

    bezier = easeOutQuint,   0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0, 0, 1, 1
    bezier = almostLinear,   0.5, 0.5, 0.75, 1.0
    bezier = quick,          0.15, 0, 0.1, 1

    animation = global,         1, 10,   default
    animation = border,         1, 5.39, easeOutQuint
    animation = windows,        1, 3.79, easeOutQuint
    animation = windowsIn,      1, 4.1,  easeOutQuint, popin 87%
    animation = windowsOut,     1, 1.49, linear,       popin 87%
    animation = fadeIn,         1, 1.73, almostLinear
    animation = fadeOut,        1, 1.46, almostLinear
    animation = fade,           1, 3.03, quick
    animation = fadeSwitch,     0
    animation = layers,         1, 3.81, easeOutQuint
    animation = layersIn,       1, 4,    easeOutQuint, fade
    animation = layersOut,      1, 1.5,  linear,       fade
    animation = fadeLayersIn,   1, 1.79, almostLinear
    animation = fadeLayersOut,  1, 1.39, almostLinear
    animation = workspaces,     0
}

# Omarchy: dwindle. force_split = 2 always opens the new window to the
# right/below, instead of i3's "split the longer side". $mod+Ctrl+v and
# $mod+Ctrl+h below still preselect explicitly.
dwindle {
    preserve_split = true
    force_split = 2
}

# Omarchy: misc / cursor / binds
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_scale_notification = true
    focus_on_activate = true
    anr_missed_pings = 3
    on_focus_under_fullscreen = 1
    initial_workspace_tracking = 0
    force_default_wallpaper = 0
}

cursor {
    hide_on_key_press = true
    warp_on_change_workspace = 1
}

binds {
    hide_special_on_workspace_change = true
}

xwayland {
    force_zero_scaling = true
}

ecosystem {
    no_update_news = true
}


# --- MONITORS -----------------------------------------------------------------
# i3: xrandr --output HDMI-1-0 --auto --same-as eDP-1   (mirrored)
#
# X11's "HDMI-1-0" is a PRIME output on the NVIDIA card; under Wayland it gets
# a different name. Run `hyprctl monitors` once on your first login and fix the
# name below if it is not HDMI-A-1.
monitor = eDP-1, preferred, 0x0, 1
monitor = HDMI-A-1, preferred, auto, 1, mirror, eDP-1
monitor = , preferred, auto, 1          # catch-all for anything else

# To go side-by-side instead (the commented xrandr line in the i3 config),
# replace the HDMI line above with:
# monitor = HDMI-A-1, preferred, auto-right, 1


# --- ENVIRONMENT --------------------------------------------------------------
# Omarchy: default/hypr/envs.lua
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,gtk3
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland

# Omarchy: default/hypr/nvidia.lua. nvidia-open ships GSP firmware, which is
# the branch that gets NVD_BACKEND=direct. (Intel UHD 770 + RTX 4050 here.)
env = NVD_BACKEND,direct
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# If the session comes up black or the external monitor misbehaves, pin the
# render GPU. Check the order with `ls -l /dev/dri/by-path/`.
# env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0


# --- STARTUP PROGRAMS ---------------------------------------------------------
# Hand the session env to systemd --user and D-Bus, otherwise xdg-desktop-portal
# (screen sharing, file pickers) starts with an empty environment.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = waybar                                  # i3: bar { status_command i3status }
exec-once = hyprpaper                               # i3: feh --bg-fill
exec-once = dunst
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = hypridle                                # i3: xss-lock -- i3lock
exec-once = wl-paste --watch cliphist store         # clipboard survives closing the source window
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# i3: redshift -m randr -l 11.93:79.83 -t 6500:3500
exec-once = gammastep -l 11.93:79.83 -t 6500:3500

# i3 also ran `dex --autostart` and `flameshot`. dex is not installed on this
# machine, and flameshot's GUI does not work under Wayland — Print is bound to
# grim+slurp below instead.


# --- APP SHORTCUTS ------------------------------------------------------------
# i3: bindsym Print exec flameshot gui
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh
bind = SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh full

# i3: bindsym $mod+Shift+f exec magnify
bind = $mod SHIFT, F, exec, magnify


# --- AUDIO CONTROLS -----------------------------------------------------------
# Identical wpctl calls to i3; waybar polls, so there is no i3status SIGUSR1 kick.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = $mod CTRL, Up,   exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = $mod CTRL, Down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind   = $mod CTRL, M,    exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle


# --- BRIGHTNESS ---------------------------------------------------------------
# i3 bound bare F6/F7, so they are swallowed globally. Kept as-is.
bindel = , F6, exec, brightnessctl set 10%-
bindel = , F7, exec, brightnessctl set +10%


# --- WINDOW MANAGEMENT --------------------------------------------------------
# i3: floating_modifier $mod  (drag to move, right-drag to resize)
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bind = $mod, Return, exec, kitty                    # i3: $mod+Return
bind = SUPER SHIFT, T, killactive                   # i3: bindsym Mod4+T kill
bind = CTRL SHIFT, J, exec, rofi -show drun         # i3: Control+Shift+j

# focus movement (vim keys)
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# move windows
bind = $mod SHIFT, Left,  movewindow, l
bind = $mod SHIFT, Down,  movewindow, d
bind = $mod SHIFT, Up,    movewindow, u
bind = $mod SHIFT, Right, movewindow, r

bind = $mod SHIFT, space, togglefloating            # i3: floating toggle

# Fullscreen. Your i3 config never bound this, so these are new.
#   $mod+f        true fullscreen - covers the bar, no gaps, no border
#   $mod+Ctrl+f   maximize        - fills the screen but keeps waybar visible
# Inside a tabbed group both act on the active tab; the group bar disappears
# in true fullscreen and comes back when you toggle off.
bind = $mod, F, fullscreen, 0
bind = $mod CTRL, F, fullscreen, 1
bind = $mod, space, exec, ~/.config/hypr/scripts/focus-mode-toggle.sh   # i3: focus mode_toggle

# i3's `$mod+a focus parent` walks up the container tree. Hyprland's dwindle
# has no addressable parent node, so there is nothing to bind here.
# bind = $mod, A, ...

bind = $mod, Tab,        movefocus, r               # i3: $mod+Tab focus right
bind = $mod SHIFT, Tab,  movefocus, l


# --- WORKSPACES ---------------------------------------------------------------
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# i3: Mod4+h / Mod4+l -> workspace prev / next
bind = SUPER, H, workspace, e-1
bind = SUPER, L, workspace, e+1

# i3: $mod+Shift+minus move scratchpad / $mod+minus scratchpad show
bind = $mod SHIFT, minus, movetoworkspacesilent, special:scratchpad
bind = $mod, minus, togglespecialworkspace, scratchpad


# --- CONFIG MANAGEMENT --------------------------------------------------------
bind = $mod SHIFT, C, exec, hyprctl reload          # i3: reload
bind = $mod SHIFT, R, exec, hyprctl reload          # i3: restart (reload is the equivalent)
bind = $mod SHIFT, E, exec, ~/.config/hypr/scripts/exit-prompt.sh


# --- RESIZE MODE --------------------------------------------------------------
# Same odd-but-yours mapping as i3: j/l shrink, k/semicolon grow.
bind = $mod, R, submap, resize
submap = resize

binde = , J,         resizeactive, -10 0
binde = , K,         resizeactive, 0 10
binde = , L,         resizeactive, 0 -10
binde = , semicolon, resizeactive, 10 0

binde = , Left,  resizeactive, -10 0
binde = , Down,  resizeactive, 0 10
binde = , Up,    resizeactive, 0 -10
binde = , Right, resizeactive, 10 0

bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset


# --- SPLITS AND LAYOUTS -------------------------------------------------------
# i3: split v / split h  -> dwindle preselects the side the next window opens on
bind = $mod CTRL, V, layoutmsg, preselect d
bind = $mod CTRL, H, layoutmsg, preselect r

# i3 had tabbed and stacked layouts. Hyprland's equivalent is a window group,
# which is tabbed; there is no stacked variant, so both keys make a group.
bind = $mod, W, togglegroup
bind = $mod, S, togglegroup
bind = $mod, bracketright, changegroupactive, f
bind = $mod, bracketleft,  changegroupactive, b

# Unlike i3's `layout tabbed`, togglegroup only groups the FOCUSED window - it
# does not sweep up its siblings. These pull a neighbour in / push one out.
bind = $mod SHIFT, H, moveintogroup, l
bind = $mod SHIFT, J, moveintogroup, d
bind = $mod SHIFT, K, moveintogroup, u
bind = $mod SHIFT, L, moveintogroup, r
bind = $mod SHIFT, G, moveoutofgroup

bind = $mod, E, layoutmsg, togglesplit               # i3: layout toggle split


# --- WINDOW RULES -------------------------------------------------------------
# Hyprland 0.56 dropped the one-line `windowrule = <rule>, <matcher>` form
# (and windowrulev2 is deprecated). Rules are now named blocks: a `match`
# sub-block selects the windows, the rest of the block is what to apply.

# i3 floated every kitty window (`for_window [class="kitty"] floating enable,
# resize set 800 500, move position center`). Dropped on purpose - kitty tiles
# now. Re-add that block here if you ever want the old behaviour back.

# Sensible defaults i3 got for free from its floating heuristics.
windowrule {
    name = tool-dialogs-float
    match {
        class = ^(pavucontrol|blueman-manager|nm-connection-editor)$
    }
    float = true
}

windowrule {
    name = pip-float
    match {
        title = ^(Picture-in-Picture)$
    }
    float = true
}

windowrule {
    name = suppress-maximize
    match {
        class = .*
    }
    suppress_event = maximize
}
