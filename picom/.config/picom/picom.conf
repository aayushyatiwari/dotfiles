# picom v13 — minimal compositor for i3.
# Its only job here: honour the per-window alpha kitty asks for
# (background_opacity in kitty.conf) and blur what's behind it.

backend = "glx";
vsync = true;

# Blur behind translucent windows. This is the only blur in play: kitty's
# background_blur is macOS/Wayland-only and was dropped from kitty.conf.
# Range 1-20. Raised for kitty's background_opacity 0.2 — at that little
# alpha the wallpaper shows through hard and text needs a calmer backdrop.
blur-method = "dual_kawase";
blur-strength = 12;

# Don't blur through these — they draw their own backdrop.
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'slop'"
];

# Leave every window's opacity alone; kitty sets its own.
# Uncomment to fade unfocused windows:
# inactive-opacity = 0.9;
# inactive-opacity-override = false;

# Fullscreen apps and video get the fast path.
unredir-if-possible = true;
