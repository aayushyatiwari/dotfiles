# Kitty — stock defaults, plus keyboard shortcuts only.
# Everything else (fonts, opacity, padding, margins, borders, cursor trail,
# layouts, theme) was removed on 2026-07-31; kitty's own defaults render better.
# Old version is in git: dotfiles/kitty/.config/kitty/kitty.conf

# seconds to wait before loading the config
auto_reload_config 0.1 
background_opacity 0.2
dynamic_background_opacity yes

shell_integration no-cursor
cursor_shape block
font_size 14.0
enable_audio_bell no
enabled_layouts splits,stack
font_family monospace 

# Needed for --cwd=current to resolve the shell's real directory.
shell_integration enabled

# --- Split appearance: gap + border between windows ---
# draw_minimal_borders must be off, otherwise kitty collapses the margins and
# draws only the single shared edge.
draw_minimal_borders no
window_margin_width 3
window_border_width 1pt
active_border_color   #61afef
inactive_border_color #3b4048
inactive_text_alpha 0.8

# --- Splits (new terminal beside the current one, same cwd) ---
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+backslash launch --location=hsplit --cwd=current
map ctrl+shift+space next_layout
map ctrl+shift+t new_tab_with_cwd
# --- Navigation (focus) — vim keys ---
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right

# --- Moving windows ---
map ctrl+shift+f move_window_forward
map ctrl+shift+b move_window_backward

# --- Resizing splits ---
map ctrl+alt+h resize_window narrower
map ctrl+alt+l resize_window wider
map ctrl+alt+k resize_window taller
map ctrl+alt+j resize_window shorter
map ctrl+alt+0 resize_window reset

# --- Misc ---
map ctrl+shift+f5 load_config_file
map ctrl+shift+g  show_scrollback
map ctrl+shift+delete combine : clear_terminal scroll active : send_text all \x0c


# Allow Ctrl+h/j/k/l to pass to Neovim for window navigation
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+l

# misc
cursor_trail 15
cursor_trail_start_threshold 0
cursor_trail_decay 0.01 0.05
# cursor_blink is not a kitty option; blink rate is cursor_blink_interval
cursor_blink_interval -1

