# Kitty — stock defaults, plus keyboard shortcuts only.
# Everything else (fonts, opacity, padding, margins, borders, cursor trail,
# layouts, theme) was removed on 2026-07-31; kitty's own defaults render better.
# Old version is in git: dotfiles/kitty/.config/kitty/kitty.conf

# --- Window management ---
map ctrl+shift+enter new_window
map ctrl+shift+w     close_window
map ctrl+shift+l     next_layout

# --- Navigation (focus) ---
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down

# --- Moving windows ---
map ctrl+shift+f move_window_forward
map ctrl+shift+b move_window_backward

# --- Tabs ---
map ctrl+shift+t     launch --type=tab --cwd=current
map alt+shift+left   previous_tab
map alt+shift+right  next_tab

# --- Misc ---
map ctrl+shift+f5 load_config_file
map ctrl+shift+k  combine : clear_terminal scroll active : send_text all \x0c
