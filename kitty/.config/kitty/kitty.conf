# Kitty. Anything not set here is kitty's default.

auto_reload_config 0.1
enable_audio_bell no

# --- Look ---
font_family JetBrainsMono Nerd Font Mono
font_size 14.0

# Block cursor, no blink, with a trail. no-cursor stops the shell from
# changing the cursor shape; the rest of shell integration (--cwd=current)
# stays on.
shell_integration no-cursor
cursor_shape block
cursor_blink_interval 0
cursor_trail 15
cursor_trail_start_threshold 0
cursor_trail_decay 0.01 0.05

# --- Splits: gap + border between windows ---
# draw_minimal_borders must be off, or kitty collapses the margins into one edge.
enabled_layouts splits,stack
draw_minimal_borders no
window_margin_width 3
window_border_width 1pt
active_border_color   #61afef
inactive_border_color #3b4048
inactive_text_alpha 0.8

# --- New windows / tabs (same cwd) ---
map ctrl+shift+enter     launch --location=vsplit --cwd=current
map ctrl+shift+backslash launch --location=hsplit --cwd=current
map ctrl+shift+t         new_tab_with_cwd
map ctrl+shift+space     next_layout

# --- Focus (vim keys) ---
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right

# --- Move windows ---
map ctrl+shift+f move_window_forward
map ctrl+shift+b move_window_backward

# --- Resize ---
map ctrl+alt+h resize_window narrower
map ctrl+alt+l resize_window wider
map ctrl+alt+k resize_window taller
map ctrl+alt+j resize_window shorter
map ctrl+alt+0 resize_window reset

# --- Misc ---
map ctrl+shift+f5     load_config_file
map ctrl+shift+g      show_scrollback
map ctrl+shift+delete combine : clear_terminal scroll active : send_text all \x0c
